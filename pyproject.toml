[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-model-cli"
version = "0.1.0"
description = "Automated threat modeling CLI for IaC inputs using LLMs."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Threat Model CLI Contributors" }
]
dependencies = [
  "typer>=0.12",
  "python-hcl2>=4.3.4",
  "openai>=1.14.0",
  "anthropic>=0.21.3",
  "rich>=13.7.1",
  "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.1",
  "pytest-cov>=4.1.0"
]

[project.scripts]
threatcli = "threatcli.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["threatcli*"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
